<!DOCTYPE html>
<html>

<head>

    <title>Meeting Summarize (DRAFT)</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            max-width:900px;
            margin:auto;
            padding:40px;
        }

        h1{
            color:#1f4e79;
        }

        textarea{
            width:100%;
            height:220px;
            font-size:16px;
            padding:15px;
            border-radius:8px;
            border:1px solid lightgray;
            resize:none;
        }

        button{

            margin-top:20px;
            padding:15px 30px;
            font-size:16px;
            border:none;
            border-radius:8px;
            background:#1f4e79;
            color:white;
            cursor:pointer;

        }

        button:hover{

            background:#163957;

        }

        #summary{

            margin-top:40px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,.1);

        }

    </style>

</head>

<body>

<h1>Meeting Summarize (DRAFT)</h1>

<p>
GAVIN LOVES ISREAL
</p>

<textarea
id="notes"
placeholder="Paste meeting notes here..."></textarea>

<br>

<button onclick="summarizeNotes()">

Summarize

</button>

<div id="summary">

<h2>Summary</h2>

<p id="output">

Nothing summarized yet.

</p>

</div>

<script>

function summarizeNotes(){

let notes=document.getElementById("notes").value;

if(notes===""){

document.getElementById("output").innerHTML=
"Please paste some meeting notes.";

return;

}

document.getElementById("output").innerHTML=

"<strong>AI Summary</strong><br><br>" +

"• Meeting successfully analyzed.<br>" +

"• Action Items detected.<br>" +

"• Client follow-up recommended.<br>" +

"• Budget discussion identified.<br><br>" +

"<strong>Original Notes:</strong><br><br>" +

notes;

}

</script>

</body>

</html>
